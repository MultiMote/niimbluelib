name: Build and deploy docs

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: ./package-lock.json

      - name: Setup rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Install dependencies
        run: npm ci

      - name: Install typedoc
        run: npm install -D typedoc@0.28.18 typedoc-plugin-include-example@3.0.2

      - name: Build
        run: npx typedoc

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOCS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H -p ${{ secrets.DOCS_SSH_PORT || 22 }} ${{ secrets.DOCS_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with Rsync
        run: |
          rsync -avz --delete \
                -e "ssh -p ${{ secrets.DOCS_SSH_PORT || 22 }}" \
                ./docs/html/ ${{ secrets.DOCS_SSH_USERNAME }}@${{ secrets.DOCS_SSH_HOST }}:${{ secrets.DOCS_DEPLOY_PATH }}/
