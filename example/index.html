<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NiimBlueLib Example</title>
    <style>
      .logger {
        width: 50%;
        height: 300px;
        overflow-y: scroll;
        border: 1px solid gray;
      }

      canvas {
        border: 1px solid gray;
      }
    </style>
  </head>
  <body>
    <button class="connect ble">Connect BLE</button>
    <button class="connect serial">Connect Serial</button>
    <button class="disconnect" disabled>Disconnect</button>
    <pre class="logger"></pre>

    <div>
      Canvas size:
      <input type="number" class="canvas-width" value="240" min="1" max="9999"/>
      x
      <input type="number" class="canvas-height" value="96" min="1" max="9999"/>
    </div>

    <canvas width="240" height="96"></canvas>
    
    <div>
      <label>
        Print task:
        <select class="print-task"></select>
      </label>
      <label>
        Print direction:
        <select class="print-direction">
          <option value="left" selected>Left</option>
          <option value="top">Top</option>
        </select>
      </label>
      <label>
        Density:
        <select class="print-density">
          <option value="1">1</option>
          <option value="2" selected>2</option>
          <option value="3">3</option>
        </select>
      </label>
      <label>
        Page color type:
        <select class="page-color"></select>
      </label>
    </div>
    <button class="print" disabled>Print</button>

    <script type="module" src="/main.js"></script>
  </body>
</html>
